name: Post-Merge Build Verification

on:
  push:
    branches:
      - main
      - feature/collation-modifier-app-7995951850818249286
  workflow_dispatch:

jobs:
  verify-build-and-test:
    name: Verify Build and Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore solution dependencies
        run: dotnet restore SQLCollationChangeApp.sln 2>&1 | tee /tmp/build-and-test.log

      - name: Build solution
        run: dotnet build SQLCollationChangeApp.sln --no-restore -p:UseSharedCompilation=false 2>&1 | tee -a /tmp/build-and-test.log

      - name: Run unit tests
        run: dotnet CollationModifier.Tests/bin/Debug/net10.0/CollationModifier.Tests.dll 2>&1 | tee -a /tmp/build-and-test.log

      - name: Run MSBuildDiagnosticPatcher unit tests
        run: dotnet MSBuildDiagnosticPatcher.Tests/bin/Debug/net8.0/MSBuildDiagnosticPatcher.Tests.dll 2>&1 | tee -a /tmp/build-and-test.log

      - name: Generate diagnostics and candidate patches
        if: failure()
        run: bin/msbuild-patcher /tmp/build-and-test.log

      - name: Append diagnostic report to step summary
        if: failure()
        run: |
          if [ -f "/tmp/build-and-test.log" ]; then
            mkdir -p build-diagnostics
            cp "/tmp/build-and-test.log" "build-diagnostics/build-and-test.log"
          fi
          if [ -f "build-diagnostics/diagnostic-report.md" ]; then
            max_size=1048576
            file_size=$(wc -c < "build-diagnostics/diagnostic-report.md")
            if [ "$file_size" -le "$max_size" ]; then
              cat "build-diagnostics/diagnostic-report.md" >> "$GITHUB_STEP_SUMMARY"
            else
              head -c "$max_size" "build-diagnostics/diagnostic-report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload diagnostic reports and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-report-${{ matrix.os }}
          path: |
            build-diagnostics/
            /tmp/build-and-test.log
          if-no-files-found: ignore
